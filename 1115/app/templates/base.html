<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/custom.css') }}">
</head>
<body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <header class="site-header shell">
        <div>
            <p class="eyebrow">Temporal orchestration · evidence first</p>
            <h1>{{ title }}</h1>
        </div>
        <div class="provider-row" aria-label="Live-mode providers">
            <span>Linkup</span><span>Browser Use</span><span>Anthropic</span><span>SmartBuckets</span>
        </div>
    </header>
    <main class="shell">{% block content %}{% endblock %}</main>
    <script src="{{ url_for('static', path='/app.js') }}"></script>
</body>
</html>
