name: Verified workflow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixture-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 1115
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 1115/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 1115/package-lock.json
      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest
      - name: Run unit and regression tests
        run: python -m pytest -q
      - name: Install Temporal CLI
        run: |
          curl -fsSL --retry 3 https://github.com/temporalio/cli/releases/download/v1.4.1/temporal_cli_1.4.1_linux_amd64.tar.gz -o /tmp/temporal.tgz
          mkdir -p /tmp/temporal-cli
          tar --no-same-owner -xzf /tmp/temporal.tgz -C /tmp/temporal-cli
          /tmp/temporal-cli/temporal --version
      - name: Run real Temporal workflow
        env:
          TEMPORAL_CLI: /tmp/temporal-cli/temporal
        run: python -m scripts.check_temporal
      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Run separate-process browser E2E
        env:
          TEMPORAL_CLI: /tmp/temporal-cli/temporal
        run: npm run test:browser
      - name: Verify published demo provenance and media
        run: python scripts/verify_demo_media.py
      - name: Require clean generated state
        working-directory: .
        run: git diff --exit-code && test -z "$(git status --porcelain)"
